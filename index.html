function streams(s){return [...new Set([s.url,...(s.backups||[])].map(safe).filter(Boolean).map(u=>u.startsWith('http:')?'https:'+u.slice(5):u))].slice(0,3)}
function nextSource(token){if(token!==seq)return;clearWatch();release();playing=false;loading=true;const u=candidates[attempt++];if(!u){loading=false;updatePlay();setStatus('Эфир недоступен — откройте источник','Эфир жеткиликсиз — булакты ачыңыз');return}
const marker=++activeToken;const valid=()=>token===seq&&marker===activeToken;const fail=()=>{if(valid()){++activeToken;nextSource(token)}};
const arm=()=>{if(!valid()||watchdog)return;watchdog=setTimeout(()=>{watchdog=0;fail()},8000)};
audio.onplaying=()=>{if(!valid())return;clearWatch();playing=true;loading=false;updatePlay();setStatus('● Воспроизведение эфира','● Түз эфир')};
audio.onwaiting=audio.onstalled=()=>{if(!valid())return;loading=true;playing=false;updatePlay();setStatus('Буферизация… до 8 сек.','Жүктөлүүдө… 8 сек. чейин');arm()};
audio.onerror=fail;
audio.onpause=()=>{if(valid()&&playing){playing=false;clearWatch();updatePlay();setStatus('Пауза','Тыныгуу')}};
setStatus(attempt>1?'Резервный поток '+attempt+'/'+candidates.length:'Подключение… до 8 сек.',attempt>1?'Кошумча эфир '+attempt+'/'+candidates.length:'Туташууда… 8 сек. чейин');updatePlay();audio.src=u;arm();try{audio.play().catch(fail)}catch(e){fail()}}
function start(s){if(!s?.url)return;clearWatch();release();const token=++seq;current=s;playing=false;loading=true;candidates=streams(s);attempt=0;$('currentName').textContent=s.name;$('currentArt').textContent=s.mark;$('currentArt').style.background=color(s);if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:'KG Radio'})}catch{}}nextSource(token);if(s.uuid&&s.api)fetch(s.api+'/json/url/'+encodeURIComponent(s.uuid)).catch(()=>{})}
function toggle(){if(playing||loading){++seq;stop()}else if(current)start(current);else start(shown().find(s=>s.url)||stations.find(s=>s.url))}function step(d){let a=shown().filter(s=>s.url);if(!a.length)a=stations.filter(s=>s.url);if(!a.length)return;let i=a.findIndex(s=>s.id===current?.id);start(a[i<0?(d>0?0:a.length-1):(i+d+a.length)%a.length])}
$('grid').onclick=e=>{if(e.target.closest('[data-own]')){const el=$('ownRadio');el.querySelector('details').open=true;el.scrollIntoView({behavior:'smooth',block:'start'});return}let p=e.target.closest('[data-play]'),f=e.target.closest('[data-fav]');if(p){let s=stations.find(s=>s.id===p.dataset.play);if(current?.id===s.id&&(playing||loading)){++seq;stop()}else start(s)}if(f){let id=f.dataset.fav;fav.has(id)?fav.delete(id):fav.add(id);save('kg-fav',[...fav]);render()}};$('filters').onclick=e=>{let b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}};$('search').oninput=render;$('play').onclick=toggle;$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('lang').onclick=()=>{lang=lang==='ru'?'ky':'ru';save('kg-lang',lang);render()};document.body.classList.toggle('light',read('kg-light',false));$('theme').onclick=()=>{document.body.classList.toggle('light');save('kg-light',document.body.classList.contains('light'))};$('volume').value=read('kg-vol',.8);audio.volume=Number($('volume').value);$('volume').oninput=()=>{audio.volume=Number($('volume').value);save('kg-vol',audio.volume)};$('timer').onchange=()=>{deadline=Number($('timer').value)?Date.now()+Number($('timer').value)*60000:0};setInterval(()=>{let left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('remaining').textContent=deadline?`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:'';if(deadline&&left===0){++seq;stop();deadline=0;$('timer').value='0'}},1000);
async function refresh(){if(apiState==='loading')return;apiState='loading';render();for(let base of ['https://de1.api.radio-browser.info','https://nl1.api.radio-browser.info','https://at1.api.radio-browser.info']){try{let res=await fetch(base+'/json/stations/bycountrycodeexact/KG?hidebroken=true&order=votes&reverse=true',{signal:AbortSignal.timeout(6500)});if(!res.ok)throw Error();let list=await res.json();if(!Array.isArray(list)||!list.length)throw Error();for(let r of list){let u=safe(r.url_resolved||r.url);if(!u||!r.name||!r.stationuuid)continue;let s=match(r.name);if(s){if(s.id==='s8'||s.own)continue;if(!s.url)s.url=u;else if(s.url!==u)s.backups=[...new Set([...(s.backups||[]),u])];s.uuid=r.stationuuid;s.api=base}else if(!stations.some(x=>x.url===u||x.id===r.stationuuid)){stations.push({id:r.stationuuid,name:r.name.trim(),url:u,site:safe(r.homepage)||news,cat:/news|talk/i.test(r.tags)?'talk':'music',freq:'',mark:r.name.trim().slice(0,3).toUpperCase(),uuid:r.stationuuid,api:base})}}apiState='ok';render();return}catch{}}apiState='fail';render()}
$('refresh').onclick=refresh;render();refresh();if('mediaSession' in navigator){for(let [a,f] of [['play',()=>{if(!playing)toggle()}],['pause',()=>{++seq;stop()}],['previoustrack',()=>step(-1)],['nexttrack',()=>step(1)]])try{navigator.mediaSession.setActionHandler(a,f)}catch{}}

let installPrompt; const installButton=$('install');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installButton.hidden=false;});
installButton.setAttribute('aria-label','Установить KG Radio');installButton.title='Установить KG Radio';
installButton.onclick=async()=>{if(installPrompt){await installPrompt.prompt();installPrompt=null;installButton.hidden=true;}};
window.addEventListener('appinstalled',()=>{installPrompt=null;installButton.hidden=true;});
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(console.warn));
</script></body></html>
